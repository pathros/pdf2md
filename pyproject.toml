[project]
name = "pdf2md"
version = "0.3.0"
description = "Convierte PDF, imágenes, Word, Excel o PowerPoint a Markdown, y Markdown a Word. OCR de visión con Ollama; el resto sin IA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf==1.28.0",
    "pymupdf4llm==1.28.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "requests==2.34.2",
    "rich==15.0.0",
]

[tool.uv]
package = false
